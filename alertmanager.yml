global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email-alerts'

receivers:
  - name: 'email-alerts'
    email_configs:
      - to: 'email1'
        from: 'email2'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'email1'
        auth_password: 'YOUR_16_CHAR_GMAIL_APP_PASSWORD'  # No spaces
        send_resolved: true