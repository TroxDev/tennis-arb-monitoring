global:
  scrape_interval: 15s 

# 1. Connect to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 2. Load the alerting rules file
rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'blackbox-http'
    metrics_path: /probe 
    params:
      module: [http_2xx]
    static_configs:
      - targets:
         - http://nginx-server/tennis_arb.html
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance 
      - target_label: __address__
        replacement: blackbox-exporter:9115